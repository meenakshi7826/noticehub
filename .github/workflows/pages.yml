name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Configure API endpoint
        env:
          NOTICEHUB_API_URL: ${{ vars.NOTICEHUB_API_URL || 'https://noticehub-api.onrender.com' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "public/index.html";
          const apiUrl = process.env.NOTICEHUB_API_URL;
          if (!apiUrl) throw new Error("Set the NOTICEHUB_API_URL repository variable to the Render API URL.");
          const parsed = new URL(apiUrl);
          if (parsed.protocol !== "https:" || parsed.username || parsed.password ||
              parsed.pathname !== "/" || parsed.search || parsed.hash) {
            throw new Error("NOTICEHUB_API_URL must be an HTTPS origin without a path, query, or fragment.");
          }
          const html = fs.readFileSync(file, "utf8");
          const configured = html.replace(
            /(<meta name="api-base-url" content=")[^"]*(")/,
            (_match, prefix, suffix) => `${prefix}${parsed.origin}${suffix}`
          );
          if (configured === html) throw new Error("Could not find the API URL setting in public/index.html.");
          fs.writeFileSync(file, configured);
          NODE

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
